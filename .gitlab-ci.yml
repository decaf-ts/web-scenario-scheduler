stages: [validate, publish]

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_COMMIT_MESSAGE =~ /-no-ci/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: node:24-bookworm
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

validate:
  stage: validate
  variables:
    CI: "true"
  script:
    - npm run prepare-it-tests
    - npm run lint
    - npx tsc --noEmit
    - npm run audit:dependencies
    - npm run build:prod
    - npm run coverage
    - npm run docs
    - npm run check:package
  artifacts:
    when: always
    paths:
      - lib/
      - dist/
      - docs/
      - workdocs/reports/
    reports:
      junit: workdocs/reports/junit/*.xml
  coverage: '/All files\s*\|\s*([\d.]+)/'
  interruptible: true

npm-publish:
  stage: publish
  needs:
    - job: validate
      artifacts: true
  script:
    - npm config set --userconfig .npmrc.publish "${CI_API_V4_URL#*:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken" "$CI_JOB_TOKEN"
    - NPM_CONFIG_USERCONFIG="$CI_PROJECT_DIR/.npmrc.publish" npm publish --registry "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
  after_script:
    - rm -f .npmrc.publish
  rules:
    - if: '$CI_COMMIT_TAG'

docker-publish:
  stage: publish
  image: docker:29-cli
  services: [docker:29-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: [validate]
  cache: []
  before_script:
    - apk add --no-cache jq
    - VERSION=$(jq -r .version package.json)
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:base-$VERSION" -t "$CI_REGISTRY_IMAGE:base-latest" -f Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:base-$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:base-latest"
  rules:
    - if: '$CI_COMMIT_TAG'

pages:
  stage: publish
  needs:
    - job: validate
      artifacts: true
  cache: []
  before_script: []
  script:
    - mv docs public
  artifacts:
    paths: [public]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
