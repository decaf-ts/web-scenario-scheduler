<!doctype html><title>Marcação Passo 2</title>
<div id="authenticated">Signed in fixture</div>
<div class="pika-single"><button class="pika-prev">Mês Anterior</button><button class="pika-next">Próximo Mês</button><div class="pika-title"></div><table class="pika-table"><tbody></tbody></table></div>
<div id="schedule"><span id="fixture_wtLrSchedule" class="ListRecords"><span><div id="fixture_wtLrSchedule_ctl00_wt33"><div class="card-right"><div class="card-appointment-time">08:30</div>Fixture doctor</div></div></span></span></div>
<input type="submit" value="Voltar" onclick="location.href='/MYLUZ/MarcacaoPasso1.aspx'">
<script>
window.view = {year:2027,month:1}; window.selected='2027-02-23'; window.events=['2027-02-23'];
function render(){
 document.querySelector('.pika-title').textContent=`${view.year}-${String(view.month+1).padStart(2,'0')}`;
 const body=document.querySelector('.pika-table tbody');body.innerHTML='';
 for(let day=1;day<=28;day++){
  const date=`${view.year}-${String(view.month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const td=document.createElement('td');td.className=[events.includes(date)?'has-event':'',selected===date?'is-selected':''].join(' ');
  const b=document.createElement('button');b.type='button';b.className='pika-button pika-day';b.dataset.pikaYear=String(view.year);b.dataset.pikaMonth=String(view.month);b.dataset.pikaDay=String(day);b.textContent=String(day);
  b.onclick=()=>{window.selected=date;render();};td.append(b);body.append(td);
 }
}
document.querySelector('.pika-prev').onclick=()=>{const d=new Date(Date.UTC(view.year,view.month-1,1));view={year:d.getUTCFullYear(),month:d.getUTCMonth()};render();};
document.querySelector('.pika-next').onclick=()=>{const d=new Date(Date.UTC(view.year,view.month+1,1));view={year:d.getUTCFullYear(),month:d.getUTCMonth()};render();};
render();
</script>
